
name: Test Instagram Access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Test Instagram HTML
        shell: bash
        run: |
          python - <<'PY'
          import re
          import urllib.request
          import urllib.error

          url = "https://www.instagram.com/p/CB2rbrfnMU-/"

          try:
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0"
                  }
              )

              with urllib.request.urlopen(
                  request, timeout=20
              ) as response:
                  html = response.read().decode(
                      "utf-8", errors="replace"
                  )
                  print("HTTP Status:", response.status)
                  print("HTML length:", len(html))

                  for field in [
                      "comment_count",
                      "like_count"
                  ]:
                      values = re.findall(
                          rf'"{field}"\s*:\s*(\d+)',
                          html
                      )
                      print(field, values[:10])

          except urllib.error.HTTPError as e:
              print("HTTP Status:", e.code)
              print("Access not available")

          except Exception as e:
              print("Request failed:", type(e).__name__)
          PY
