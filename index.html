
<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Qazaq Social Analytics</title>
  <style>
    body {
      margin: 0;
      background: #0b1220;
      color: white;
      font-family: Arial, sans-serif;
      padding: 30px;
    }
    main { max-width: 1000px; margin: auto; }
    h1 { color: #38bdf8; }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit,
        minmax(220px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }
    .card {
      background: #1e293b;
      padding: 25px;
      border-radius: 15px;
    }
    .number {
      font-size: 32px;
      font-weight: bold;
      margin-top: 12px;
    }
    .note { color: #94a3b8; }
    a { color: #38bdf8; }
  </style>
</head>
<body>
  <main>
    <h1>🇰🇿 Qazaq Social Analytics</h1>
    <p>Нұрлан Қоянбаев — Instagram рекорды</p>

    <div class="cards">
      <div class="card">
        <div>💬 Комментарийлер</div>
        <div class="number">23 383 909</div>
      </div>
      <div class="card">
        <div>❤️ Лайктар</div>
        <div class="number">1 059 680</div>
      </div>
      <div class="card">
        <div>📈 Репосттар</div>
        <div class="number">41 734</div>
      </div>
    </div>

    <p class="note">
      Дереккөз: Instagram.
      24.10.2026 күнгі скриншот.
      Әзірге автоматты жаңартылмайды.
    </p>

    <a href="https://www.instagram.com/p/CB2rbrfnMU-/">
      Instagram жарияланымын ашу
    </a>
  </main>
</body>
</html>
