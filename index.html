
<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Qazaq Social Analytics</title>

  <style>
    body {
      margin: 0;
      background: #0b1220;
      color: white;
      font-family: Arial, sans-serif;
      padding: 30px;
    }

    main {
      max-width: 1000px;
      margin: auto;
    }

    h1 {
      color: #38bdf8;
    }

    .cards {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .card {
      background: #1e293b;
      padding: 25px;
      border-radius: 15px;
    }

    .number {
      font-size: 32px;
      font-weight: bold;
      margin-top: 12px;
    }

    .note {
      color: #94a3b8;
      margin-top: 25px;
    }

    a {
      color: #38bdf8;
    }
  </style>
</head>

<body>
  <main>
    <h1>Qazaq Social Analytics</h1>

    <p>Нұрлан Қоянбаев — Instagram рекорды</p>

    <div class="cards">

      <div class="card">
        <div>Комментарийлер</div>
        <div class="number" id="comments">
          Жүктелуде...
        </div>
      </div>

      <div class="card">
        <div>Лайктар</div>
        <div class="number" id="likes">
          Жүктелуде...
        </div>
      </div>

    </div>

    <p class="note" id="updated">
      Статистика жүктелуде...
    </p>

    <p class="note" id="status"></p>

    <a href="https://www.instagram.com/p/CB2rbrfnMU-/"
       target="_blank" rel="noopener noreferrer">
      Instagram жарияланымын ашу
    </a>

  </main>

  <script>
    const numberFormat = new Intl.NumberFormat("kk-KZ");

    async function loadStats() {
      const status = document.getElementById("status");

      try {
        const response = await fetch(
          "./stats.json?t=" + Date.now(),
          { cache: "no-store" }
        );

        if (!response.ok) {
          throw new Error(
            "HTTP " + response.status
          );
        }

        const data = await response.json();

        if (
          data.shortcode !== "CB2rbrfnMU-" ||
          !Number.isSafeInteger(data.comments) ||
          !Number.isSafeInteger(data.likes) ||
          data.comments < 0 ||
          data.likes < 0 ||
          !data.collected_at ||
          Number.isNaN(Date.parse(data.collected_at))
        ) {
          throw new Error("JSON деректері жарамсыз");
        }

        document.getElementById("comments")
          .textContent =
          numberFormat.format(data.comments);

        document.getElementById("likes")
          .textContent =
          numberFormat.format(data.likes);

        const updatedAt = new Date(
          data.collected_at
        );

        document.getElementById("updated")
          .textContent =
          "Соңғы дерек жиналған уақыт: " +
          updatedAt.toLocaleString("kk-KZ", {
            timeZone: "Asia/Almaty",
            dateStyle: "medium",
            timeStyle: "medium"
          }) +
          " (Алматы уақыты)";

        status.textContent =
          "Дереккөз: Instagram браузер экспорты";

      } catch (error) {
        console.error(error);

        status.textContent =
          "Статистиканы жүктеу қатесі: " +
          error.message;

        document.getElementById("comments")
          .textContent = "Қолжетімсіз";

        document.getElementById("likes")
          .textContent = "Қолжетімсіз";
      }
    }

    loadStats();

    // Әр 5 минут сайын JSON файлын қайта тексеру
    setInterval(loadStats, 300000);
  </script>
  
<section style="max-width:1000px;margin:40px auto">
  <h2>Комментарийлер динамикасы</h2>

  <div style="background:#1e293b;padding:20px;
              border-radius:15px;margin-bottom:20px">
    <h3>Сағаттық өсім</h3>
    <canvas id="hourlyChart"></canvas>
  </div>

  <div style="background:#1e293b;padding:20px;
              border-radius:15px">
    <h3>Күндік өсім</h3>
    <canvas id="dailyChart"></canvas>
  </div>

  <p id="historyStatus" style="color:#94a3b8"></p>
</section>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>

<script>
let hourlyChart;
let dailyChart;

const almatyHour = new Intl.DateTimeFormat(
  "en-CA", {
    timeZone: "Asia/Almaty",
    year: "numeric", month: "2-digit",
    day: "2-digit", hour: "2-digit",
    hourCycle: "h23"
  }
);

function hourKey(date) {
  const parts = Object.fromEntries(
    almatyHour.formatToParts(date)
      .filter(p => p.type !== "literal")
      .map(p => [p.type, p.value])
  );
  return `${parts.year}-${parts.month}-${parts.day} ${parts.hour}:00`;
}

function aggregate(history, type) {
  const groups = new Map();

  for (const item of history) {
    const date = new Date(item.collected_at);
    if (isNaN(date.getTime())) continue;

    const key = hourKey(date);
    const bucket = type === "daily"
      ? key.slice(0, 10)
      : key;

    const old = groups.get(bucket);

    // Әр сағат/күн ішіндегі соңғы өлшем
    if (!old || date > old.date) {
      groups.set(bucket, {
        date,
        comments: item.comments
      });
    }
  }

  const rows = [...groups.entries()]
    .sort((a, b) => a[1].date - b[1].date);

  return rows.slice(1).map((row, i) => ({
    label: row[0],
    growth: row[1].comments - rows[i][1].comments
  }));
}

function drawChart(id, rows, oldChart) {
  if (oldChart) oldChart.destroy();

  return new Chart(
    document.getElementById(id), {
      type: "bar",
      data: {
        labels: rows.map(r => r.label),
        datasets: [{
          label: "Комментарий өсімі",
          data: rows.map(r => r.growth),
          backgroundColor: "#38bdf8"
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: {
            labels: { color: "#ffffff" }
          }
        },
        scales: {
          x: {
            ticks: { color: "#94a3b8" }
          },
          y: {
            ticks: { color: "#94a3b8" }
          }
        }
      }
    }
  );
}

async function loadHistory() {
  const status = document.getElementById(
    "historyStatus"
  );

  try {
    const response = await fetch(
      "./history.json?t=" + Date.now(),
      { cache: "no-store" }
    );

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    const history = await response.json();
    if (!Array.isArray(history)) {
      throw new Error("Invalid history");
    }

    const hourly = aggregate(history, "hourly");
    const daily = aggregate(history, "daily");

    hourlyChart = drawChart(
      "hourlyChart", hourly, hourlyChart
    );

    dailyChart = drawChart(
      "dailyChart", daily, dailyChart
    );

    status.textContent =
      `Сақталған өлшемдер: ${history.length}. ` +
      "Өсім тек жиналған өлшемдер бойынша есептеледі.";

  } catch (error) {
    status.textContent =
      "Тарихты жүктеу қатесі: " + error.message;
  }
}

loadHistory();
setInterval(loadHistory, 300000);
</script>

</body>
</html>
